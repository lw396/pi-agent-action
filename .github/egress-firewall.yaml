# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall)
# may reach. All other hosts are blocked, apart from any that GitHub's firewall allows
# by default. Add a host only when a workflow step needs it, name it in full (no '*'), and say what uses it.
mode: enforce
allow:
  # OpenCode Zen API: model requests from the pi Runner in test-base-action.yml,
  # test-custom-executables.yml, test-mcp-servers.yml and
  # test-structured-output.yml (model opencode/..., key OPENCODE_API_KEY)
  - opencode.ai
  # GitHub API: calls made by the action and its MCP servers
  - api.github.com
  # Bun release downloads (oven-sh/setup-bun in action.yml)
  - release-assets.githubusercontent.com
  # npm packages (bun install in action.yml)
  - registry.npmjs.org
  # Bun install script (test-custom-executables.yml, "Install Bun manually")
  - bun.sh
