name: Test Custom Executables

# Runs the action with a Bun installed by the workflow (path_to_bun_executable)
# instead of the one the action installs. pi has no executable of its own to
# swap: it runs inside the action's process, so path_to_claude_code_executable
# was removed rather than ported.
#
# Manual dispatch only for now, like test-runner.yml. Restore the
# pull_request trigger (same-repository PRs only, since fork PRs get no
# secrets) and call this workflow from ci-all.yml once a manual run has
# passed. See docs/development/pi-port-proposal.md, "CI 与集成测试".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-custom-executables:
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun manually
        run: |
          echo "Installing Bun..."
          curl -fsSL https://bun.sh/install | bash
          echo "Bun installed at: $HOME/.bun/bin/bun"

          # Verify Bun installation
          if [ -f "$HOME/.bun/bin/bun" ]; then
            echo "✅ Bun executable found"
            $HOME/.bun/bin/bun --version
          else
            echo "❌ Bun executable not found"
            exit 1
          fi

      - name: Run the action with the custom Bun
        id: run
        uses: ./
        with:
          prompt: List the files here whose names start with 'package'
          # A low-cost OpenCode Zen model, paid for with the OPENCODE_API_KEY secret.
          model: opencode/gpt-6-luna
          pi_args: "--tools ls,read"
          path_to_bun_executable: /home/runner/.bun/bin/bun
          github_token: ${{ github.token }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Verify the outputs and the execution file
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
          SESSION_ID: ${{ steps.run.outputs.session_id }}
        run: .github/scripts/verify-runner-outputs.sh
