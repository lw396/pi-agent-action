name: Test MCP Servers

# Runs the action against a real model to check that pi loads the action's
# own MCP servers through the SDK with `direct` exposure: the model sees
# mcp__github_comment__update_comment as a tool of its own and calls it, and
# the call reaches the server process.
#
# Agent mode starts the comment server when allowed_tools names its tool, but
# has no tracking comment, so the server answers with its own error instead of
# updating a comment. That proves the round trip without touching GitHub.
#
# Manual dispatch only for now, like test-runner.yml. Restore the
# pull_request trigger (same-repository PRs only) and call this workflow from
# ci-all.yml once a manual run has passed. See docs/development/pi-port-proposal.md,
# "CI 与集成测试".
on:
  workflow_dispatch:
    inputs:
      model:
        description: "pi model, as provider/id"
        required: false
        default: "opencode/gpt-6-luna"

permissions:
  contents: read

env:
  # A low-cost OpenCode Zen model, paid for with the OPENCODE_API_KEY secret.
  TEST_MODEL: ${{ github.event.inputs.model || 'opencode/gpt-6-luna' }}

jobs:
  test-direct-mcp-server:
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the action with the comment server
        id: run
        uses: ./
        with:
          prompt: >-
            Call the mcp__github_comment__update_comment tool once, with the
            body "MCP test", and report the text it returns. Do not call any
            other tool.
          model: ${{ env.TEST_MODEL }}
          allowed_tools: mcp__github_comment__update_comment
          github_token: ${{ github.token }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Verify the outputs and the execution file
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
          SESSION_ID: ${{ steps.run.outputs.session_id }}
        run: .github/scripts/verify-runner-outputs.sh

      - name: Verify the MCP tool was called directly and reached the server
        env:
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
        run: |
          set -euo pipefail
          TOOL=mcp__github_comment__update_comment

          echo "Tool calls:"
          jq -r '.[] | select(.type == "tool_execution_end") | .toolName' "$EXECUTION_FILE"

          # Declared to the model directly: the model's own response calls the
          # tool by name, rather than through codemode or tool_search.
          jq -e --arg tool "$TOOL" '
            any(.[]; .type == "message_end" and .message.role == "assistant"
              and any(.message.content[]; .type == "toolCall" and .name == $tool))
          ' "$EXECUTION_FILE" > /dev/null ||
            { echo "❌ the model did not call $TOOL directly"; exit 1; }

          # The server's own answer: there is no tracking comment in agent mode.
          jq -e --arg tool "$TOOL" '
            any(.[]; .type == "tool_execution_end" and .toolName == $tool
              and (.result | tostring | contains("TRACKING_COMMENT_ID environment variable is required")))
          ' "$EXECUTION_FILE" > /dev/null ||
            { echo "❌ $TOOL did not return the server's response"; exit 1; }

          echo "✅ The comment server was loaded with direct exposure"
