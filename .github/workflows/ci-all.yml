# Orchestrates all CI workflows - runs on PRs, pushes to main, and manual dispatch
# Individual test workflows are called as reusable workflows
#
# The integration test workflows (test-*.yml) call a real model with the
# OPENCODE_API_KEY secret and are manual dispatch only for now. To add one
# back here once a manual run has passed:
#   - restore its pull_request and workflow_call triggers, for same-repository
#     PRs only (fork PRs get no secrets);
#   - keep it on ubuntu-24.04-firewall, or, if that runner is unavailable,
#     add the job and the reason to the exemption table in
#     .github/scripts/check_workflow_hardening.py instead of weakening it;
#   - keep the model cheap, and filter on paths (src/runner/, src/mcp/,
#     action.yml) if runs get expensive.
name: CI All

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
