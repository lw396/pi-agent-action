# Orchestrates all CI workflows - runs on PRs, pushes to main, and manual dispatch
# Individual test workflows are called as reusable workflows
#
# The integration test workflows (test-*.yml) still run the Claude-based
# executor and authenticate through Anthropic workload identity federation, so
# they are not called here until they are ported to pi. See
# docs/pi-port-proposal.md.
name: CI All

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
