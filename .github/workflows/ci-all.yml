# Orchestrates all CI workflows - runs on PRs, pushes to main, and manual dispatch
# Individual test workflows are called as reusable workflows
#
# The integration test workflows (test-*.yml) call a real model with the
# OPENCODE_API_KEY secret. They are manual dispatch only, and are added here
# once a manual run has passed on the egress-firewall runner. See
# docs/development/pi-port-proposal.md, "CI 与集成测试".
name: CI All

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
