name: Test pi Runner

# Runs the action in agent mode against a real model, so the Runner
# (src/runner/) is tested end to end.
#
# Manual dispatch only for now: whether ubuntu-24.04-firewall runners are
# available to this repository is not confirmed yet. Restore the
# pull_request trigger (same-repository PRs only, since fork PRs get no
# secrets) and call this workflow from ci-all.yml once a manual run has
# passed. See docs/development/pi-port-proposal.md, "CI 与集成测试".
on:
  workflow_dispatch:
    inputs:
      test_prompt:
        description: "Prompt for the agent"
        required: false
        default: "List the files here whose names start with 'package'"
      model:
        description: "pi model, as provider/id"
        required: false
        default: "opencode/gpt-6-luna"

permissions:
  contents: read

env:
  # A low-cost OpenCode Zen model, paid for with the OPENCODE_API_KEY secret.
  TEST_MODEL: ${{ github.event.inputs.model || 'opencode/gpt-6-luna' }}
  TEST_PROMPT: >-
    ${{ github.event.inputs.test_prompt
    || 'List the files here whose names start with ''package''' }}

jobs:
  test-provider-env:
    # The provider key comes from pi's environment variable for the provider.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the action in agent mode
        id: run
        uses: ./
        with:
          prompt: ${{ env.TEST_PROMPT }}
          model: ${{ env.TEST_MODEL }}
          pi_args: "--tools ls,read"
          github_token: ${{ github.token }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Verify the outputs and the execution file
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
          SESSION_ID: ${{ steps.run.outputs.session_id }}
        run: .github/scripts/verify-runner-outputs.sh

  test-api-key-input:
    # The provider key comes from the api_key input instead.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the action in agent mode
        id: run
        uses: ./
        with:
          prompt: ${{ env.TEST_PROMPT }}
          model: ${{ env.TEST_MODEL }}
          api_key: ${{ secrets.OPENCODE_API_KEY }}
          pi_args: "--tools ls,read"
          github_token: ${{ github.token }}

      - name: Verify the outputs and the execution file
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
          SESSION_ID: ${{ steps.run.outputs.session_id }}
        run: .github/scripts/verify-runner-outputs.sh
