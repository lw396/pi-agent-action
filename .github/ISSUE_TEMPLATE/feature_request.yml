name: Feature request
description: Suggest a new input, behaviour or documentation improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A workflow snippet helps.
  - type: checkboxes
    id: upstream
    attributes:
      label: claude-code-action
      options:
        - label: claude-code-action already does this (link it below if you can)
  - type: textarea
    id: context
    attributes:
      label: Additional context
