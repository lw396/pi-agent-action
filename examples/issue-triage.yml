name: pi Issue Triage
description: Run pi for issue triage in GitHub Actions
on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run pi for Issue Triage
        uses: lw396/pi-agent-action@v1
        with:
          model: openai/<model-id>
          prompt: |
            Triage issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue with `gh issue view ${{ github.event.issue.number }}`
            2. List the repository's labels with `gh label list`
            3. Add the labels that fit (type, area, priority) with `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`

            Only use labels that already exist. Do not comment on the issue.
            Run each gh command on its own, without pipes or `&&`.
          allowed_tools: "Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*)"
          allowed_non_write_users: "*" # Required for issue triage workflow, if users without repo write access create issues
          # With allowed_non_write_users, bash only keeps allowlisted env variables; gh needs GH_TOKEN
          allowed_bash_env: GH_TOKEN
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
