name: Issue Deduplication

on:
  issues:
    types: [opened]

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check for duplicate issues
        uses: lw396/pi-agent-action@v1
        with:
          model: anthropic/<model-id>
          prompt: |
            Analyze this new issue and check if it's a duplicate of existing issues in the repository.

            Issue: #${{ github.event.issue.number }}
            Repository: ${{ github.repository }}

            Your task:
            1. Read the issue with `gh issue view ${{ github.event.issue.number }}`
            2. Search for similar existing issues with `gh issue list --search "<keywords>" --state all`, using keywords from the issue title and body
            3. Compare the new issue with existing ones to identify potential duplicates

            Criteria for duplicates:
            - Same bug or error being reported
            - Same feature request (even if worded differently)
            - Same question being asked
            - Issues describing the same root problem

            If you find duplicates:
            - Add a comment on the new issue linking to the original issue(s) with `gh issue comment`
            - Apply a "duplicate" label with `gh issue edit --add-label duplicate`
            - Be polite and explain why it's a duplicate
            - Suggest the user follow the original issue for updates

            If it's NOT a duplicate:
            - Don't add any comments
            - You may apply appropriate topic labels based on the issue content

            Run each gh command on its own, without pipes or `&&`.

            Be thorough but efficient. Focus on finding true duplicates, not just similar issues.

          allowed_tools: "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
