name: pi Review - Path Specific

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # Only run when specific paths are modified
      - "src/**/*.js"
      - "src/**/*.ts"
      - "api/**/*.py"
      # You can add more specific patterns as needed

jobs:
  pi-review-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: pi Code Review
        uses: lw396/pi-agent-action@main
        with:
          model: openai/<model-id>

          # Optional: Model that classifies held-back inline comments (default: model).
          # Add its provider's key to env below.
          # classify_model: typesafe/jev-latest

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request focusing on the changed files.

            Note: The PR branch is already checked out in the current working directory.

            Provide feedback on:
            - Code quality and adherence to best practices
            - Potential bugs or edge cases
            - Performance considerations
            - Security implications
            - Suggestions for improvement

            Since this PR touches critical source code paths, please be thorough
            in your review and provide inline comments where appropriate.

          allowed_tools: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
